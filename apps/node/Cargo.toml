[package]
name = "jr-node"
description = "Unified Jaryn Remote desktop/CLI node (controller and host)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jr-crypto = { path = "../../crates/jr-crypto" }
jr-proto = { path = "../../crates/jr-proto" }
jr-session = { path = "../../crates/jr-session" }
jr-host-win = { path = "../../crates/jr-host-win" }
jr-input = { path = "../../crates/jr-input" }
jr-transport = { path = "../../crates/jr-transport" }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }

[dev-dependencies]
jr-signal = { path = "../signal" }
jr-relay = { path = "../relay" }
